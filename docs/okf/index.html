* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  font-size: 14px;
  color: #0f172a;
  background: #f8fafc;
  display: flex;
  flex-direction: column;
  height: 100vh;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: #fff;
  border-bottom: 1px solid #e2e8f0;
  flex-shrink: 0;
}
.title strong { font-size: 16px; margin-right: 8px; }
.muted { color: #64748b; font-size: 12px; }
.controls { display: flex; gap: 8px; }
.controls input, .controls select, .controls button {
  font-size: 13px;
  padding: 5px 8px;
  border: 1px solid #cbd5e1;
  border-radius: 4px;
  background: #fff;
}
.controls input { width: 220px; }
.controls button { cursor: pointer; background: #f1f5f9; }
.controls button:hover { background: #e2e8f0; }

main {
  display: flex;
  flex: 1;
  min-height: 0;
}
#graph {
  flex: 1 1 60%;
  background: #fff;
  border-right: 1px solid #e2e8f0;
  min-width: 0;
  position: relative;
}
#detail {
  flex: 0 0 40%;
  overflow-y: auto;
  padding: 18px 22px;
  background: #fff;
}
#detail-empty {
  text-align: center;
  margin-top: 40px;
}

.detail-header { margin-bottom: 12px; }
.detail-header h1 {
  font-size: 18px;
  margin: 4px 0 2px;
  font-weight: 600;
}
.type-chip {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  color: #fff;
  background: #94a3b8;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
dl.frontmatter {
  display: grid;
  grid-template-columns: 90px 1fr;
  row-gap: 4px;
  column-gap: 12px;
  margin: 8px 0 12px;
  font-size: 13px;
}
dl.frontmatter dt {
  color: #64748b;
  font-weight: 500;
}
dl.frontmatter dd { margin: 0; }
dl.frontmatter a { color: #2563eb; word-break: break-all; }

.tag {
  display: inline-block;
  padding: 1px 6px;
  margin: 0 4px 2px 0;
  border-radius: 4px;
  background: #f1f5f9;
  color: #475569;
  font-size: 11px;
}

.badges {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 8px 0 4px;
}
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  border: 1px solid transparent;
}
.badge.status-stable { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
.badge.status-draft { background: #fefce8; color: #a16207; border-color: #fde68a; }
.badge.status-deprecated { background: #f1f5f9; color: #64748b; border-color: #cbd5e1; text-decoration: line-through; }
.badge.trust-unverified { background: #f1f5f9; color: #64748b; border-color: #cbd5e1; }
.badge.trust-machine-confirmed { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
.badge.trust-human-reviewed { background: #f5f3ff; color: #6d28d9; border-color: #ddd6fe; }
.badge.stale { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
.badge.fresh { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }

.sources-list { padding-left: 18px; margin: 0; }
.sources-list li { margin: 1px 0; }

hr { border: none; border-top: 1px solid #e2e8f0; margin: 14px 0; }

#detail-body { font-size: 13px; line-height: 1.55; }
#detail-body h1 {
  font-size: 16px; margin: 18px 0 6px;
  padding-bottom: 4px; border-bottom: 1px solid #e2e8f0;
}
#detail-body h2 { font-size: 14px; margin: 14px 0 4px; }
#detail-body h3 { font-size: 13px; margin: 12px 0 4px; }
#detail-body p { margin: 6px 0; }
#detail-body code {
  background: #f1f5f9;
  padding: 1px 4px;
  border-radius: 3px;
  font-size: 12px;
  font-family: ui-monospace, "SF Mono", Consolas, monospace;
}
#detail-body pre {
  background: #0f172a;
  color: #e2e8f0;
  padding: 10px 12px;
  border-radius: 6px;
  overflow-x: auto;
  font-size: 12px;
}
#detail-body pre code { background: transparent; color: inherit; padding: 0; }
#detail-body ul, #detail-body ol { padding-left: 22px; margin: 6px 0; }
#detail-body li { margin: 2px 0; }
#detail-body table { border-collapse: collapse; margin: 8px 0; }
#detail-body th, #detail-body td {
  border: 1px solid #e2e8f0; padding: 4px 8px; font-size: 12px;
}
#detail-body a.internal { color: #2563eb; cursor: pointer; }
#detail-body a.external { color: #2563eb; }

#detail-backlinks { margin-top: 18px; }
#detail-backlinks h2 { font-size: 13px; color: #64748b; margin-bottom: 6px; }
#detail-backlinks ul { padding-left: 18px; }
#detail-backlinks a { color: #2563eb; cursor: pointer; }

</style>
</head>
<body>
<header>
  <div class="title">
    <strong id="bundle-name"></strong>
    <span class="muted">OKF bundle</span>
  </div>
  <div class="controls">
    <input id="search" type="search" placeholder="Search title / id / tag">
    <select id="filter-type">
      <option value="">All types</option>
    </select>
    <select id="layout">
      <option value="cose">cose (force)</option>
      <option value="concentric">concentric</option>
      <option value="breadthfirst">breadth-first</option>
      <option value="circle">circle</option>
      <option value="grid">grid</option>
    </select>
    <button id="reset">Reset view</button>
  </div>
</header>

<main>
  <section id="graph"></section>
  <section id="detail">
    <div id="detail-empty" class="muted">Click a node to see its details.</div>
    <article id="detail-content" hidden>
      <header class="detail-header">
        <span class="type-chip" id="detail-type"></span>
        <h1 id="detail-title"></h1>
        <div class="muted" id="detail-id"></div>
      </header>
      <div class="badges" id="detail-badges"></div>
      <dl class="frontmatter">
        <dt>Description</dt><dd id="detail-description"></dd>
        <dt>Resource</dt><dd id="detail-resource"></dd>
        <dt>Tags</dt><dd id="detail-tags"></dd>
        <dt>Generated</dt><dd id="detail-generated"></dd>
        <dt>Verified</dt><dd id="detail-verified"></dd>
        <dt>Sources</dt><dd id="detail-sources"></dd>
      </dl>
      <hr>
      <div id="detail-body"></div>
      <section id="detail-backlinks" hidden>
        <h2>Cited by</h2>
        <ul id="backlinks-list"></ul>
      </section>
    </article>
  </section>
</main>

rces": [{"id": "source", "resource": "../../../vercel.json", "title": "Rewrites and which branches deploy"}], "trust_tier": "unverified", "stale": false, "color": "#1baf7a", "size": 38}}, {"data": {"id": "runbooks/run-locally", "label": "Run locally", "type": "Runbook", "description": "Install, copy the example environment, start the dev server against a local or the staging backend.", "resource": "", "tags": ["runbook", "local", "vite"], "status": "stable", "generated": {"by": "claude-code/claude-fable-5-1", "at": "2026-09-14T10:00:00Z"}, "verified": [], "stale_after": "", "sources": [{"id": "source", "resource": "../../../README.md", "title": "Quick start"}], "trust_tier": "unverified", "stale": false, "color": "#1baf7a", "size": 37}}], "edges": [{"data": {"id": "concepts/app-shell-and-routing__decisions/history-routing", "source": "concepts/app-shell-and-routing", "target": "decisions/history-routing"}}, {"data": {"id": "concepts/app-shell-and-routing__concepts/readonly-embed", "source": "concepts/app-shell-and-routing", "target": "concepts/readonly-embed"}}, {"data": {"id": "concepts/backend-contract__pitfalls/env-not-tracked", "source": "concepts/backend-contract", "target": "pitfalls/env-not-tracked"}}, {"data": {"id": "concepts/session-and-auth__concepts/backend-contract", "source": "concepts/session-and-auth", "target": "concepts/backend-contract"}}, {"data": {"id": "concepts/session-and-auth__decisions/clerk-proxy-mode", "source": "concepts/session-and-auth", "target": "decisions/clerk-proxy-mode"}}, {"data": {"id": "concepts/shared-components__decisions/player-name-standard", "source": "concepts/shared-components", "target": "decisions/player-name-standard"}}, {"data": {"id": "concepts/shared-components__decisions/player-panel-drafting-only", "source": "concepts/shared-components", "target": "decisions/player-panel-drafting-only"}}, {"data": {"id": "concepts/shared-components__pitfalls/race-icon-context", "source": "concepts/shared-components", "target": "pitfalls/race-icon-context"}}, {"data": {"id": "concepts/shared-components__decisions/grouped-table", "source": "concepts/shared-components", "target": "decisions/grouped-table"}}, {"data": {"id": "concepts/shared-components__concepts/backend-contract", "source": "concepts/shared-components", "target": "concepts/backend-contract"}}, {"data": {"id": "conventions/code-style__concepts/shared-components", "source": "conventions/code-style", "target": "concepts/shared-components"}}, {"data": {"id": "conventions/code-style__concepts/stores", "source": "conventions/code-style", "target": "concepts/stores"}}, {"data": {"id": "conventions/code-style__conventions/okf-bundle", "source": "conventions/code-style", "target": "conventions/okf-bundle"}}, {"data": {"id": "decisions/player-name-standard__pitfalls/race-icon-context", "source": "decisions/player-name-standard", "target": "pitfalls/race-icon-context"}}, {"data": {"id": "overview__concepts/app-shell-and-routing", "source": "overview", "target": "concepts/app-shell-and-routing"}}, {"data": {"id": "overview__concepts/session-and-auth", "source": "overview", "target": "concepts/session-and-auth"}}, {"data": {"id": "overview__concepts/backend-contract", "source": "overview", "target": "concepts/backend-contract"}}, {"data": {"id": "overview__concepts/stores", "source": "overview", "target": "concepts/stores"}}, {"data": {"id": "overview__concepts/shared-components", "source": "overview", "target": "concepts/shared-components"}}, {"data": {"id": "overview__runbooks/run-locally", "source": "overview", "target": "runbooks/run-locally"}}, {"data": {"id": "overview__conventions/testing", "source": "overview", "target": "conventions/testing"}}, {"data": {"id": "overview__conventions/git-and-pull-requests", "source": "overview", "target": "conventions/git-and-pull-requests"}}, {"data": {"id": "runbooks/build-and-preview__pitfalls/worktree-node-modules-and-icon-font", "source": "runbooks/build-and-preview", "target": "pitfalls/worktree-node-modules-and-icon-font"}}], "bodies": {"concepts/app-shell-and-routing": "# Routes and roles\n\n`src/helpers/router.js` lists every route with `meta.role`, the lowest session role that may open it, ranked `public < guest < member < captain < admin`. `meta.nav: false` hides a route from the navigation. `meta.season: true` says the path carries a season slug, so the guard loads the season list first.\n\n| Role | Typical routes |\n|---|---|\n| public | `/login`, `/series/:id`, `/leagues`, `/events`, `/events/:id`, `/report`, `/koth/dashboard`, `/credits`, `/random-stats` |\n| guest | `/profile` only; it shows the join-the-Discord card |\n| member | `/`, `/signup`, `/availability`, `/players`, `/player/:id`, `/upcoming`, `/team/:id`, `/match/:id`, `/fantasy`, `/ladder`, `/events/:id/entrants` |\n| captain | `/seasons/:id/assign`, `/team/:id/season/:season_id/rounds` (reads; the view gates writes to admins) |\n| admin | `/seasons`, `/seasons/:id/maps`, `/maps`, `/teams`, `/config/*`, `/fantasy/bets`, `/fantasy/tiers`, `/koth`, `/events/new`, `/events/:id/admin`, `/user-guide` |\n\nThe guard: a public route opens for anyone. Otherwise, with no session the path is saved and the browser goes to `/login`; a login lands on the saved path, else on `/` for a member and `/profile` for a guest. A session below the role goes to `/profile` for a guest and to `/no-access` for everyone else. An unknown path lands on `/` rather than a blank page, because old links from Discord and the website exist.\n\nRouting is history mode on plain paths since 2026-09-04; there is no bridge for old `/#/x` links. See [the decision](../decisions/history-routing.md).\n\n# Season slugs\n\nA season in a path is its slug, `gnl-s18`, made from its name; a bare id still resolves for old links. The view reads the id off the loaded season list.\n\n# The app bar\n\n`App.vue` draws the navigation from `/me`: the name and avatar, the role, the current season by slug, the team link (the captained seat in the current season, else the roster row), and the theme menu (light, dark, system, stored in `localStorage`). It hands Clerk's `useAuth()` to the auth store, watches the sign-in state, calls `/me` once the session lands, and routes to the saved path. A failed `/me` shows its message on the login page and signs out.\n\n# Read-only embed\n\nA page opened with `?readonly=1` hides the chrome, is always light, and posts its height to the parent window, so the WordPress site can embed a report in an iframe. See [read-only embed](readonly-embed.md).", "concepts/backend-contract": "The backend repository, `wc3-gym-backend`, owns every definition below. This file says only what this app reads, so a backend change can find its consumers.\n\n# The base URL\n\n`VITE_BACKEND_URL`, read once in `src/helpers/backend-url.js`, which throws at load when it is unset. Locally it is `/api`, which the Vite dev server proxies. On a Vercel target it is the backend's absolute URL, set on the project per environment. `/api` on Vercel would fall through to the SPA and return HTML. See [the pitfall](../pitfalls/env-not-tracked.md).\n\n# Rules relied on everywhere\n\n- Every error is `{\"error\": \"<text>\"}`, sometimes with a `message` beside an `error` code. The wrapper reads both.\n- List routes take `limit` (up to 500) and `offset` and answer `X-Total-Count`; `sort` and `order` on the routes that support them.\n- Reads are open. A write needs an admin or the owning member; the app hides the buttons of writes the role cannot make, because a 401 ends the session.\n- The GNL season payloads keep `season_id`, `phase` (`open`, `commenced`, `overdue`, `complete`), `playday` and `rounds`.\n- A series answers `player1_race` / `player2_race` resolved, and takes `player1_off_race` / `player2_off_race` on a write.\n- Every datetime is UTC and ends in `Z`; Luxon reads it and shows the viewer's zone.\n- The veto board answer carries `week_map_id` for the fixed map of game 1; the name is kept on purpose.\n- The veto board answer carries `viewer_side` (`A`, `B`, or null for an admin, who edits either side). Each side is a player or a team: `id` and `name` are the user's, or null for a team side, which sets `team_id` and `team_name` instead.\n\n# The session answer\n\n`GET /me`: `role` (`guest`, `member`, `captain`, `admin`), `actual_role`, `name`, `avatar`, `user` (the linked player or null), `superadmin`, `signed_up`, `season_id`, `team`, `seats` (a list of `{team_id, season_id}`), and `seasons` (every running season with `phase`, `signups_open`, `scheduling_enabled`, `checkin_days`, dates, `signed_up`, `team`, `captain`). The router guard, the app bar, the home page and every draft page read it.\n\n# Routes by store\n\n| Store | Routes |\n|---|---|\n| `auth` | `POST /login`, `GET /me` |\n| `season` | `/seasons`, `/seasons/{id}`, `/seasons/{id}/maps`, `/maps/order`, `/rounds`, `/signups`, `/signups/{user}`, `/teams`, `/achievements`, `/ladder`, `/ladder/players`, `/ladder-sync`, `/maps/ladder-import`, `/achievements` |\n| `event` | `/leagues`, `/leagues/{id}`, `/events`, `/events/{id}`, `/me/events`, `/events/{id}/entrants...`, `/divisions`, `/divisions/assign`, `/stages`, `/stages/{id}/seeds`, `/seeds/lock`, `/generate`, `/rounds`, `/series`, `/standings`, `/advance`, `/finish`, `/koth/nights`, `/koth/nights/{id}/close` |\n| `player` | `/users`, `/users/{id}`, `/users/{id}/ban`, `/users/{id}/history`, `/users/{id}/w3c-sync`, `/users/{id}/ladder`, `/users/search`, `/user-info`, `/signup`, `/player-series`, `/player-history` |\n| `team` | `/teams`, `/teams/basic`, `/teams/{id}`, `/teams/season/{id}`, `/teams/season/{id}/basic`, `/teams/{id}/seasons/{sid}`, `/players`, `/captains`, `/availability`, `/w3c-sync`, `/teams/{id}/image` |\n| `match` | `/matches`, `/matches/{id}`, `/matches/{id}/replays`, `/matches/search`, `/draft-series...`, `/draft-series/{id}/promote` |\n| `series` | `/series`, `/series/{id}`, `/series/{id}/result-kind`, `/series/{id}/places`, `/series/{id}/sides`, `/series/search`, `/series/season/{id}/search`, `/series/{id}/casts...`, `/casts/last`, `/series/{id}/games`, `/player-series/{id}`, `/player-series/{id}/veto`, `/player-series/{id}/replays/{game}/upload-url`, `/player-series/{id}/free-time` |\n| `availability` | `/player-availability`, `/player-blocks...`, `/teams/{id}/seasons/{sid}/availability` |\n| `map` | `/maps`, `/maps/{id}`, `/maps/ladder-import`, `/maps/{id}/image` |\n| `config` | `/config/settings`, `/config/settings/{key}`, `/config/w3c`, `/config/admins`, `/config/discord-role-bindings...`, `/config/discord-hidden-roles`, `/config/discord-roles`, `/config/discord-roles/sync`, `/config/discord-guild-roles`, `/config/discord-role-groups`, `/config/koth/nightbot-token` |\n| `fantasy` | `/fantasy/teams...`, `/fantasy/bets...`, `/fantasy/tiers`, `/fantasy/teams/{id}/season/{sid}/breakdown`, `/fantasy-team`, `/fantasy-bet` |\n| `ladder` | `/seasons/{id}/ladder`, `/users/{id}/ladder` |\n| `player_career_stats` | `/stats/career`, `/stats/career/{id}` |\n\nThe backend pins the GNL payloads, the error envelope and the paged routes in its own tests. A field this app reads that is not in those tests is a reliance the backend cannot see; add a line here when you add one, and tell the backend.\n\n# What the app never does\n\nIt never builds a URL from a template without the one `backendUrl` import, never reads `error.detail`, never sends a request with `credentials`, and never caches a backend answer beyond the session, except the `me` row.", "concepts/readonly-embed": "The public site at warcraft-gym.com embeds the season report in an iframe. `App.vue` reads `?readonly=1` (or `true`): the app bar and navigation are hidden, the theme is forced light because the site is light, and a `ResizeObserver` posts `{ type: 'gnl-iframe-height', height }` to the parent on every size change so the frame fits. The route is public, so no session is needed.\n\nThe site's own code lives in another repository and calls the backend directly for its tables; only the report page is embedded from here.", "concepts/session-and-auth": "# Two sessions\n\n1. **A member.** Clerk's Vue plugin, `publishableKey` from `VITE_CLERK_PUBLISHABLE_KEY`, Discord as the only sign-in method. Every flow stays on `/login`; Clerk's post-login navigation is kept in-page by `routerPush` and `routerReplace` so the app routes once the session lands. `/sso-callback` is where Discord sends the browser back. The session token comes from `clerk.getToken()` on every request.\n2. **The super admin.** `/admin-login` posts the shared admin token to `POST /login` and keeps the answer in `localStorage` under `user`. It has no Discord account and no Clerk session. The legacy token wins when both exist.\n\n# The /me answer is the session\n\nAfter sign-in the store calls `GET /me` and keeps the answer in `localStorage` under `me`. The app reads the role, the name, the avatar, the linked player, the captain seats and the running seasons from it. `isAdmin`, `isCaptain` and `isCaptainOf(team, season)` are getters over it. The cached `me` is keyed to the Clerk publishable key, so a switch between the dev and the production instance starts clean.\n\nSign-out calls Clerk's `signOut()`; clearing storage or cookies is not a sign-out, because the Clerk session cookie is HttpOnly. The owner of the definition of roles is the backend; this app only ranks the word it receives. See [the backend contract](backend-contract.md).\n\n# The fetch wrapper\n\n`fetchWrapper` in `src/helpers/fetch-wrapper.js` is the only way the app calls the backend. It attaches `Authorization: Bearer <token>` to every request whose URL starts with the backend URL, except `/login` and the one edge-cached ladder read, which must stay bearer-free to be cacheable. It sends `X-View-As` and `X-View-Seats` when an admin is viewing as a lower role. It parses the error envelope into an `Error` whose `message` is `body.message`, else `body.error`, else the text, with the body's keys copied on, so a view reads `error.message` and a code check reads `error.error`. A 401 on a live session signs out; a 403 is shown, not acted on.\n\n`getPage`, `postPage`, `getAll` and `postAll` read the paged list routes with `limit` and `offset` and `X-Total-Count`.\n\n# View as\n\nAn admin picks a role, and for a captain a set of seats, to see the app as that role. The store keeps it in `localStorage` under `viewAs`, the wrapper sends the headers, and the backend lowers the role for each request, so the admin meets the same 403s a member would. `/me` keeps `actual_role` so the switch stays visible.\n\n# Production proxy\n\nClerk cannot own a `vercel.app` subdomain, so production runs the Clerk production instance in proxy mode: `vercel.json` rewrites `/__clerk/(.*)` to `api/clerk-proxy.js`, an edge function that forwards to Clerk's API with the proxy URL and the secret key. The rewrite sits before the SPA catch-all. Previews and local use the dev instance with the public key in `.env.example`. See [the decision](../decisions/clerk-proxy-mode.md).", "concepts/shared-components": "`DESIGN.md` lists the shared components with what each shows. This file adds the rules that took a decision to settle.\n\n# PlayerName\n\nA player is drawn as `{flag} {name} {race} {mmr}` everywhere, the Discord cards included, and the name links to the player page. That is the one standard; no page draws a name its own way. See [the decision](../decisions/player-name-standard.md).\n\n- By default `PlayerName` is a `RouterLink` to the player page.\n- On a drafting page, where the page holds unsaved work, the page calls `provide(panelLinks, true)`. Under it the name opens the side panel instead and shows a dock icon in the primary colour with the title \"Opens in a side panel\". The providers today: the season team assign page, the match page's series draft, and the panel itself. No other page opens the panel. See [the decision](../decisions/player-panel-drafting-only.md).\n- Inside a form dialog on any other page, pass `plain`, because a link would drop the typed input: the veto board in report mode, the fantasy bet dialog, the add-players dialog.\n\n# RaceIcon\n\nA race icon asserts a fact about a row. Show one only when the row has a race: this game, this scheduled series, this signup. A player's profile race is not a race for a row; a table without a race dimension shows the flag and the name only. A labelled \"Main race\" column is fine because the label says what it is. See [the pitfall](../pitfalls/race-icon-context.md).\n\n# GroupedTable\n\nThe one table for groups of rows: a tinted clickable header row per group, detail rows on the same column grid, so a detail number sits under the group total it adds up to. Never nest a table inside a table cell. Numeric columns right-aligned; column titles bare nouns. See [the decision](../decisions/grouped-table.md).\n\n# StageView\n\n`StageView` draws one stage per division in any format. `DESIGN.md` describes the drawing. Two rules took a decision:\n\n- The standings card is the first child of the stage in the DOM, so a screen reader and a keyboard user meet the table before the rounds. A bracket alone pushes it under the draw with CSS `order`, because a bracket is read first and ranked after. No other page reorders with CSS.\n- The third-place box names itself off the stage's `third_place` flag and the two loser slots its series carries, never off the column's name.\n\n# VetoBoard\n\n`VetoBoard` reads which side the viewer acts for from the board answer's `viewer_side`; it never works the side out from ids on the client. A side that is a team shows its team name when the answer sets `team_name`, and the player through `PlayerName` otherwise. See [the backend contract](backend-contract.md).\n\n# The rest\n\n`RowActions` folds three or more row buttons into a menu. `ColumnNote` is a column title with a help note. `StatusAlert` shows a load or save message with a retry. `EventHeader` and `PlayerHeader` top the event and player pages. `TeamRoster` draws captains and members of one team in one event. `FixtureSeries` draws the ordered series of a fixture. `StageView` and `SeriesBox` draw a stage of any format and one series. `VetoBoard` draws the veto and embeds in the Report Result dialog. `DivisionBracketing` draws the MMR bands of the divisions.", "concepts/stores": "# Shape\n\n`src/stores/index.js` re-exports every store. A store is `defineStore` with `state` for the rows it holds (`seasons`, `current_season`, `events`, `event` and so on) and `actions` that call `fetchWrapper` and assign the answer. A store method returns the answer too, so a view can await it without reading the state. A store holds no derived numbers; the backend answers them.\n\n| Store | Holds |\n|---|---|\n| `auth` | the session: `user` (the admin token), `me`, `viewAs`, `loginError` |\n| `season` | the season list, the current season, its maps, rounds, signups, achievements, ladder |\n| `event` | leagues, events, one event, entrants, stages, standings, nights |\n| `player` | players, one player, the player's own series and history |\n| `team` | teams, a team, a team's season page, the availability grid |\n| `match` | fixtures and draft series |\n| `series` | series, casts, games, the veto board, replay links, free time |\n| `availability` | the round answers and the soft blocks |\n| `map` | maps and the ladder import |\n| `config` | settings, admins, Discord role bindings and the sync |\n| `fantasy` | fantasy teams, bets, tiers, the breakdown |\n| `ladder` | the season and player ladder reads |\n| `player_career_stats` | career rows |\n\n# Rules\n\n- A view calls a store; a component receives props. Neither imports `fetchWrapper`.\n- `ensureSeasons()` loads the season list once; the router guard calls it for routes that carry a slug.\n- `resolveCurrentSeasonId()` in `src/helpers/current-season.js` reads the `current_gnl_season` setting and falls back to the newest season, the same rule the backend applies.\n- A store method that writes returns the backend's answer and lets the view refetch what it shows. There is no optimistic update.", "concepts/theme": "- `src/helpers/palette.mjs` is the only place a colour value is written. `main.js` hands both themes to Vuetify. `DESIGN.md` documents every token; if the two differ, the code is right and the document needs a fix.\n- `src/helpers/theme.js` picks light, dark or the system setting; the choice sits in `localStorage` under `theme`, and `activeTheme()` runs before the first paint so the page never flashes.\n- Dark is its own set of values, not an inverted light. A new token gets both values and, when text sits on it, an `on-<token>` ink. `palette.test.mjs` checks the contrast.\n- Win is blue and loss is red-orange, never green and red, for red-green colour blindness. Status colours (`error`, `warning`, `info`, `success`) mean a state of the app and are never chart series.\n- Type: Alegreya for headings, Alegreya Sans for everything else, both bundled; every number uses lining tabular digits.\n- The `?readonly=1` embed is always light.\n\nThe steps to add a colour, and the known gaps where the app still breaks its own rules, are in `DESIGN.md`.", "conventions/code-style": "# Stack\n\nVue 3 with `<script setup>`, Vuetify 3 for every control, Pinia for the stores, vue-router 4 on plain paths, Vite. Clerk's Vue SDK owns the member session. Luxon for dates, d3 for chart maths, flagpack for flags. `npm run lint` runs ESLint with `vue3-essential` and `eslint:recommended` and fixes what it can.\n\n# Where logic goes\n\n- A view (`src/views/*.vue`) draws a page and calls stores. A component (`src/components/*.vue`) is a reusable piece; see [shared components](../concepts/shared-components.md).\n- A store (`src/stores/*.store.js`) owns the fetches for one area. See [stores](../concepts/stores.md).\n- A pure rule goes in `src/helpers/<name>.mjs` with a `<name>.test.mjs` beside it, run by `npm test` on node's own test runner. No Vue import in an `.mjs` helper, so it runs in node. Examples: the season phase words, the best-of and map rules, the draft order, the bracket layout, the fantasy tiers, the event labels.\n- The few `.js` helpers (`router.js`, `fetch-wrapper.js`, `backend-url.js`, `theme.js`) touch the browser or the stores.\n\n# Colour and type\n\nEvery colour is a theme token from `src/helpers/palette.mjs`: `color=\"primary\"`, `class=\"text-win\"`, `rgb(var(--v-theme-loss))`. Never a hex value or a Vuetify palette name in a view. Text wears a text token; a result, a tier or a race gets a small coloured mark beside the text. Colour never carries meaning alone. `DESIGN.md` lists every token with its light and dark value and where it is used, and `palette.test.mjs` checks the contrast pairs. A pull request that adds a token or closes a known gap edits `DESIGN.md` too.\n\n# Words on the page\n\n- Page titles (`h1`) and app bar and menu entries use Title Case. Everything else uses sentence case: dialog titles, buttons, labels, hints, columns, alerts, chips, card titles.\n- A column title is a short noun with no legend in brackets. Numeric columns are right-aligned. No table shows a database id.\n- A hint is one short instruction, or nothing.\n- Use the events vocabulary from the `Events` section of `DESIGN.md`: league, event, stage, round, fixture, series, game, division. Never \"week\", never \"team series\", never \"match\" for a series.\n\n# Comments and prose\n\nA comment describes the current state in the present tense, on one line where it can. Nothing about what used to be, no TODO. Prose in pull requests and in this bundle uses short plain sentences. See [the writing rule](okf-bundle.md).\n\n# What not to add\n\n- No second table component, no second player-name fragment, no hand-rolled chart when a `GroupedTable`, a `PlayerName` or a d3 scale already exists.\n- No second copy of a pure rule. A rule two pages need lives once in `src/helpers`, under one name, with one node test. Before writing a helper, search `src/helpers` for the same arithmetic or the same label under another name, and call that one.\n- No configuration knob that restates a library default.\n- No hand-written parser over a binary format. The replay reader inflates a block and searches its text; it never walks records.", "conventions/git-and-pull-requests": "# Branches\n\n- Nothing is committed to `main` directly. Every change is a branch and a pull request with base `main`.\n- Branch prefixes: `feature/`, `fix/`, `refactor/`, `chore/`. `chore/` is trivial upkeep only.\n- Pull requests are squash merged. The title and body become the commit on `main`; write the body as a commit message, plain summary first.\n- Reference an issue as `Issue #37` or `Part of #37`, never with a closing keyword: the issue stays open until the change is reviewed on production.\n- Text an AI agent wrote in a pull request body starts with a note saying so; a co-written commit ends with a `Co-Authored-By` trailer. Never override the commit author.\n\n# Pushes cost a build\n\nEvery push to a branch creates a Vercel preview deployment, and the Hobby plan caps deployment creations per day across the account. Batch local commits and push once when the pull request is ready for review. Not a hard rule, but the default.\n\n# There is no CI on pull requests\n\nThis repository runs no lint, test or build on a pull request. The only workflow force-pushes `staging` to the merged commit. Vercel builds after the merge. So:\n\n- run `npm run lint`, `npm test` and `npm run build` yourself before pushing;\n- before the second merge of a batch, build the combination: refresh the branch from `main` (or make a local merge) and run `npm run build`, gated on the build's exit code, never on a grep of its output. Two green branches once broke `main` together when one removed a helper the other imported. See [the pitfall](../pitfalls/no-ci-build-the-merged-pair.md).\n- when a unit of a batch renames or removes a shared helper, merge it first and cut the others from its tip.\n\n# Backend and frontend together\n\nA change that needs both repositories ships the backend first when the frontend reads a new field, and the frontend first when the backend stops answering an old one. A preview of an unmerged frontend branch can point at an unmerged backend branch through a branch-scoped `VITE_BACKEND_URL` on the Vercel project; delete it after the merge.", "conventions/okf-bundle": "# What this bundle is\n\n`docs/okf/` is an Open Knowledge Format (OKF) bundle: a directory of markdown files with YAML frontmatter, readable by a person and by an AI agent. Each file is one concept. The file path is the concept id. `index.md` lists a directory and `log.md` records changes; every other `.md` file is a concept.\n\nThe bundle exists so that a new contributor, human or agent, can read how the app works, why it works that way, and which mistakes were already made, without asking the people who built it.\n\n# Frontmatter\n\nEvery concept starts with a YAML block. `type` is required. The types this bundle uses:\n\n| type | What the file holds |\n|---|---|\n| Repository | the one overview of this repository |\n| Convention | a rule the code follows |\n| Domain Concept | a thing the league runs on, and how the app models it |\n| Data Model | tables and model families |\n| API Area | a group of routes and their rules |\n| Integration | how this repository talks to a service outside it |\n| Runbook | steps to do one operational task |\n| Decision | a choice that was made, when, and why it stands |\n| Pitfall | a mistake that was made once, and how to not repeat it |\n\nThe other fields: `title`, `description` (one sentence), `tags`, `generated: { by, at }` (who wrote the current text and when), `verified: [{ by, at }]` (who checked it against the code), `status` (`draft`, `stable` by default, `deprecated`), `stale_after`, and `sources` (what the text was written from).\n\n`generated.by` names the writer: `human:<github handle>` for a person, `<tool>/<model>` for an agent. A concept with no `verified` entry is unverified. When a maintainer reads a concept against the code and finds it true, they add a `verified` entry with their own handle. Nobody adds one for someone else.\n\n# Sources and links\n\nA concept names what it was written from in `sources`. A source inside this repository is a relative path from the concept file, for example `../../../src/helpers/router.js`, so the link works on GitHub and survives a rename of the repository. A source outside the repository is a URL, or a short description when there is no URL, for example `Maintainers' decision, 2026-09-08`.\n\nLinks between concepts are relative markdown links, for example `../decisions/derived-not-stored.md`. The OKF spec prefers bundle-absolute links that start with `/`. This bundle uses relative links because GitHub renders them and bundle-absolute ones break there.\n\n# The one rule about other repositories\n\nThe app is three repositories: the backend, the frontend and the Discord adapter. Each has its own bundle. A bundle describes only what its own repository proves, plus the decisions that shaped it.\n\nA shared fact is owned by one repository:\n\n- the backend (`wc3-gym-backend`) owns the domain model, the API contract, the roles, the settings keys and the environment variable names it reads;\n- the frontend (this repository) owns its pages, its design rules and the way it consumes the API;\n- the Discord adapter owns the interaction handshake and the cron worker.\n\nAnother repository is named only through its contract: an HTTP route, a header, a query parameter, an environment variable name, a Discord payload shape. Never a file path into another repository, and never a link to a file in another bundle. Those paths move without telling anyone.\n\nEach bundle's `index.md` has one section, \"Neighbouring bundles\", that names the other repositories by their GitHub root. That is the only cross-repository pointer, one line per neighbour, so a moved repository costs one line in each neighbour.\n\nWhere a concept must be understood on both sides, the consuming repository writes a short \"as consumed here\" concept that names the fields it relies on, and says in prose which repository owns the definition. It does not copy the definition.\n\nTests keep the two sides in step, not prose. The backend pins the response shapes its consumers read in `tests/test_public_contract.py`, `tests/test_contract.py`, `tests/test_gnl_snapshot.py` and `tests/test_error_envelope.py`. A change to one of those tests is a change to a contract and needs a change in a consumer.\n\n# Writing\n\nWrite short sentences: one fact per sentence, the present tense, the active voice. Say what is, not what used to be. A decision says when it was made and why. Never name a person and never quote one: write \"the maintainers\" and summarise what was concluded.\n\nThe bundle is public. Never write a secret, a token, a database URL, an account or guild id, or any detail about a person into it. The full list of what never goes in, and the check to run before a commit, is [`AGENTS.md`](../../../AGENTS.md) at the repository root.\n\n# Keeping it true\n\n- A pull request that changes a fact this bundle states changes the concept in the same pull request and updates `generated.at`.\n- A concept that no longer holds gets `status: deprecated` and one line naming what replaced it. It is not deleted, so links keep working.\n- `log.md` gets one line per change, newest first.\n- `index.html` beside the root `index.md` is the graph viewer from the OKF reference repository, served by GitHub Pages from `docs/`; `just okf-graph` regenerates it after a change to the bundle. It carries a no-index tag and is not a concept.\n- `npm test` runs `docs/okf/okf.test.mjs`. It checks that every concept has a `type`, that `index.md` files carry no frontmatter except the root one, and that every relative link resolves to a file.", "conventions/testing": "# Unit tests\n\n`npm test` runs `node --test` over `src/**/*.test.mjs` and `docs/**/*.test.mjs`. There are about forty. A helper that holds a rule gets a test file beside it, in node's own runner, with no framework. `palette.test.mjs` checks that every declared ink passes 4.5:1 on its fill, that form labels pass on the three surfaces, and that dark `error` stays apart from `loss`.\n\n# Rendering is the real test\n\nA grep of the built bundle proves a string compiled in; it says nothing about whether anyone sees it. For a user-visible change, drive the real page, assert the element's box and computed style, take a screenshot and look at it. Ask \"would someone landing here see this\", not \"is it in the DOM\".\n\nWays to get a page up, cheapest first:\n\n1. Read-only pages: `VITE_PROXY_TARGET=<staging backend url> npx vite --port 5003`. The tracked `.env.example` value `/api` is proxied and the browser sees one origin.\n2. Admin writes: run the backend locally with a test admin token against the shared staging database, build with `VITE_BACKEND_URL=http://localhost:8000`, sign in at `/admin-login`.\n3. A branch with a backend migration: make the branch copy of the staging database from the backend worktree first; the backend project builds no branch previews.\n\n# Traps in a worktree\n\n- A worktree's `node_modules` is empty; node resolves up to the main checkout, so `npm test`, `npx vite` and `npm run build` work. Never `npm install` in a worktree.\n- `npx vite` in dev mode inside a worktree refuses the Material Design Icons font (it lives outside the project root), so every icon renders as an empty box. That is the harness, not a bug. Build and serve `dist` with `npx vite preview` to see icons; note `vite preview` runs no `/api` proxy.\n- After switching worktrees, restart `vite` with `--force`, or modules answer 504 Outdated Optimize Dep.\n\n# What is not tested\n\nViews have no unit tests. A change to a view is judged by rendering it and by the helpers it calls.", "decisions/clerk-proxy-mode": "# Decision\n\nSince 2026-08-30. `api/clerk-proxy.js` forwards `/__clerk/*` to Clerk's API with the proxy URL and the secret key, and `vercel.json` rewrites the path to it before the SPA catch-all. Previews and local development stay on the dev instance.\n\n# Why\n\nThe production domain is a `vercel.app` subdomain, which Clerk cannot bind by DNS; proxy mode is Clerk's supported way to serve its API from such a domain. The backend owns the decision to use Clerk at all.\n\n# Consequences\n\n- A Clerk change on production is made in the production instance's dashboard, not the dev one.\n- The session cookie is HttpOnly; a sign-out calls Clerk, never clears storage.\n- The cached `me` is keyed to the publishable key, so an instance switch needs no manual clearing.", "decisions/design-tokens-only": "# Decision\n\nThe stone and bronze look, light and dark, was approved on 2026-09-11 and written into `DESIGN.md` on 2026-09-13. `palette.mjs` is the one place a value lives; `palette.test.mjs` checks every ink on its fill.\n\n# Why\n\nA colour written in a view drifts from the theme and breaks in dark. A test on the pairs keeps the contrast honest without looking at every page.\n\n# Consequences\n\n- Text wears a text token; a result, tier or race gets a mark beside the text, never coloured text.\n- Win is blue and loss is red-orange. Status colours are not chart series.\n- Two exceptions are allowed: the Discord brand colours on the Discord buttons and the trophy artwork.\n- A pull request that adds a token also edits `DESIGN.md`.", "decisions/grouped-table": "# Decision\n\nMade 2026-08-31. A table nested in a cell misaligns its header under the parent's columns, and a legend inside a column title clutters it. `GroupedTable` draws one tinted clickable header row per group and the detail rows on the same column grid, so detail numbers sit under the group total and visibly add up.\n\n# Consequences\n\n- When a view grows a grouped or breakdown table, put it on `GroupedTable`.\n- Numeric columns right-aligned; column titles bare nouns; icons carry meaning, not legends in titles.\n- Artwork attribution lives on the public credits page only, never in component comments.", "decisions/history-routing": "# Decision\n\nSince 2026-09-04. Hash routing came with the starter template, not with a reason. No bridge for `/#/x` links was needed at the time of the switch.\n\n# Consequences\n\n- Deep links are plain paths; Vite and Vercel serve `index.html` for every path.\n- Clerk needs no dashboard change for a same-origin path change.\n- vue-router parses `?` before `#`; read `to.fullPath` if a hash ever matters.", "decisions/player-name-standard": "# Decision\n\nMade 2026-09-10 for the whole app: `{flag} {name} {race} {mmr}`, the name linking to the player page. It replaced an earlier order with the race icon before the flag. The Discord cards, owned by the backend, draw the same order.\n\n# Why\n\nThree design sets drew a name three ways and read as three apps. One fragment, retrofitted everywhere when it changes, keeps the product one thing.\n\n# Consequences\n\n- Never draw a name by hand in a view. Use `PlayerName`.\n- A race shows only when the row has one. See [the pitfall](../pitfalls/race-icon-context.md).", "decisions/player-panel-drafting-only": "# Decision\n\nMade 2026-09-10. The panel exists so that reading a profile never costs a page its unsaved work; only the team draft and the series draft hold such work. Elsewhere a real link is what people expect. The mark for panel mode is the `mdi-dock-right` icon in the primary colour; a dotted underline and a pill were drawn on the real pages and rejected.\n\n# Consequences\n\n- A new page with unsaved work and player names calls `provide(panelLinks, true)`. Nothing else opens the panel.\n- A name in a form dialog on another page is `plain`.", "decisions/title-case": "# Decision\n\nMade 2026-09-13. A page title is the name of a place in the app; a button is an instruction.\n\n# Consequences\n\nPut this line in every frontend brief: h1 and navigation entries Title Case; everything else sentence case. `base.css` turns off Vuetify's capitals on buttons, so a label shows as written.", "decisions/veto-in-report-result": "# Decision\n\nDecided 2026-09-07. Fewer page jumps is a standing rule across the app, so the existing board component embeds inside the dialog instead of a link out or a second popup. The dialog says by default that it records a veto done elsewhere, and still syncs with an opponent stepping live.\n\nSince 2026-09-09 the veto is not a required input: the form warns strongly and never blocks; each game is marked with a winner; the replay upload sits beside its game.\n\n# Consequences\n\n- Treat \"fewer page jumps\" as a standing preference on every screen.\n- The wording of the warning is the open question, not whether it blocks.\n- One veto UI exists. A second board or a launcher is not added.", "log": "# Bundle history\n\n## 2026-09-14\n\n* **Update**: shared components gains the StageView standings order and third-place rule and the VetoBoard side rule; code style gains the one-copy rule for helpers; the backend contract names the veto board's `viewer_side` and team side fields.\n* **Creation**: Established the bundle: conventions, concepts, runbooks, decisions and pitfalls, written from the code on `main`, README, DESIGN.md, and the maintainers' recorded decisions. Every concept is `generated` by an agent and carries no `verified` entry yet.\n", "overview": "# What it is\n\nOne single-page app for everyone: the public event and series pages, a member's profile, signup, availability, series reporting and fantasy pages, a captain's draft pages, and the admin pages for seasons, teams, maps, config, Discord roles and KOTH nights. It draws nothing of its own data; every number comes from the backend API, and the backend's `/me` answer decides what the app shows.\n\n# Where it runs\n\n| Target | What |\n|---|---|\n| production | Vercel project `wc3-gym-frontend`, built from `main`; Clerk production instance in proxy mode |\n| staging | the `staging` branch, force-pushed to the merged commit on every push to `main`; a public preview at a fixed alias, on the Clerk dev instance, pointed at the staging backend |\n| previews | every pushed branch, public, on the dev instance |\n| local | `npm run dev` on port 5003, proxying `/api` to a backend on 5002 |\n\n# Layout\n\n```\napi/clerk-proxy.js   the edge function that serves Clerk's API from this domain\nsrc/\n  main.js            fonts, Vuetify with the palette, Clerk, Pinia, the router\n  App.vue            the app bar, the session watch, the theme, the read-only embed\n  views/             one file per page; index.js exports them\n  components/        the shared pieces\n  stores/            one Pinia store per area, all fetches\n  helpers/           router, fetch wrapper, backend URL, theme, and the pure .mjs rules with tests\n  assets/            base.css, race icons, achievement icons, media\nDESIGN.md            every colour token, the type, the casing rules, the shared components, the events vocabulary, the known gaps\nADMIN_UI_USER_GUIDE.md  the admin guide, also served at /user-guide\n```\n\n# Start here\n\n1. [App shell and routing](concepts/app-shell-and-routing.md), [session and auth](concepts/session-and-auth.md).\n2. [The backend contract as consumed here](concepts/backend-contract.md), [stores](concepts/stores.md).\n3. `DESIGN.md` in full, then [shared components](concepts/shared-components.md).\n4. [Run locally](runbooks/run-locally.md), [testing](conventions/testing.md), [git and pull requests](conventions/git-and-pull-requests.md).\n5. Before a change: the [decisions](decisions/index.md) and the [pitfalls](pitfalls/index.md).", "pitfalls/edge-cache-no-bearer": "# What happened\n\nThe season ladder read is cached at the Vercel edge to keep egress down. A request with a bearer is never cached, so the wrapper sends none on that route. Separately, an entry filled by a non-browser client was stored without the CORS header and browsers reported a network error until it expired; the backend now writes the header in the handler.\n\n# The rule\n\nA route added to `EDGE_CACHED` must be open on the backend and must write its own CORS header there. Tell the backend when adding one.", "pitfalls/env-not-tracked": "# What happened\n\nNineteen files built the backend URL from a template string with no check, so an unset value became `undefined` inside every request and every call 404ed with no clue. `.env` was then untracked and replaced by `.env.example`; pulling that commit deleted `.env` from every clone, and the app threw at load until `cp .env.example .env` was run again.\n\n# The rule\n\n- One module reads `VITE_BACKEND_URL` and throws when it is unset. Everything imports `backendUrl` from it.\n- `cp .env.example .env` once per clone and per worktree. The environment beats the file.\n- `/api` is a URL prefix the dev server proxies. `api/` is the Vercel functions folder, holding only the Clerk proxy. On a Vercel target `VITE_BACKEND_URL` is the backend's absolute URL; `/api` there falls through the SPA catch-all and returns HTML.", "pitfalls/preview-stack": "# What happened\n\nEvery preview signed in on the dev instance while `VITE_BACKEND_URL` on the preview target pointed at production, so `/me` always 401ed and the login card spun forever with the error swallowed.\n\n# The rule\n\nPreview and development targets point at the staging backend, which verifies with the dev key. A failed `/me` now shows its message on the login page and signs out. A branch that needs an unmerged backend uses a branch-scoped `VITE_BACKEND_URL` override.", "pitfalls/race-icon-context": "# The rule\n\nBefore passing `race` to `PlayerName` or `RaceIcon`, name the row's race source: this game, this scheduled series, this signup. No source, no icon. A labelled \"Main race\" column is fine because the label says it is the profile field. Season pages read the signup race alone and never fall back to the profile race.", "pitfalls/vite-outdated-dep": "# The rule\n\n`npm run dev` already passes `--force`. A bare `npx vite` after switching worktrees needs `--force` too, or every module answers `504 Outdated Optimize Dep`.", "pitfalls/worktree-node-modules-and-icon-font": "# What happened\n\nScreenshots from a dev server inside a worktree showed every Material icon as an empty rectangle, and the boxes were reported as a rendering bug more than once. The font was refused with 403 because it resolved into the parent checkout, outside the project root the dev server allows.\n\n# The rule\n\n- Never `npm install` in a worktree. Node walks up; `npm test`, `npm run build` and `npx vite` all work.\n- Read a package's source from the main checkout's `node_modules`.\n- A boxed glyph from a worktree dev server is the harness. Confirm the glyph name in the icon font's CSS, or build and serve `dist` to see it.", "runbooks/build-and-preview": "# Steps\n\n1. `npm run build` writes `dist/`. Gate anything on its exit code, never on a grep of its output.\n2. `npm run preview` serves `dist/` on port 5050. It runs no `/api` proxy, so build with an absolute `VITE_BACKEND_URL=http://localhost:8000 npm run build` or forward the API yourself.\n3. Icons render only from a build: the dev server inside a worktree refuses the icon font. See [the pitfall](../pitfalls/worktree-node-modules-and-icon-font.md).\n4. To drive a page in a script, use playwright-core with the chromium it ships; sign in through `/admin-login` for admin pages, or with a Clerk ticket for a member session.", "runbooks/deploy-vercel": "# The normal path\n\n1. Merge to `main`. Vercel builds production from the commit. There is no build on the pull request itself beyond the preview.\n2. The workflow force-pushes `staging` to the same commit, so the staging alias serves the merged code.\n3. Confirm by opening the page, not by looking for a deployment row: a rate-limited day produces none and production keeps the previous build. A burst of merges cancels the superseded builds and marks their commits failed; only the last one matters.\n\n# Targets and their environment\n\n| Target | `VITE_BACKEND_URL` | Clerk |\n|---|---|---|\n| production | the production backend | production instance, proxy mode, with `VITE_CLERK_PROXY_URL` and `CLERK_SECRET_KEY` for the edge function |\n| preview and development | the staging backend alias | dev instance |\n\nNever point a preview at the production backend: its session is signed by the other instance and every `/me` answers 401. A branch that needs an unmerged backend gets a branch-scoped `VITE_BACKEND_URL` on the project, deleted after the merge. Never set `VITE_BACKEND_URL=/api` on a Vercel target.\n\n# Previews are public\n\nPreview access settings are managed on the Vercel project.\n\n# Limits\n\nThe account is on the Hobby plan: a cap on deployment creations per day and a daily build quota across both projects. Batch pushes. A preview check that failed on the quota is not a code failure. Deployment retention is set in the dashboard, a day for everything but production.\n\n# Rewrites\n\n`vercel.json` rewrites `/__clerk/(.*)` to the Clerk proxy function first, then every other path to `index.html`. The order matters.", "runbooks/run-locally": "# Steps\n\n1. `npm install`. Node LTS.\n2. `cp .env.example .env`. The file is not tracked; the two values in it are public (the `/api` prefix and the dev Clerk key). Do this once per clone and per worktree. Never a symlink.\n3. Start a backend on port 5002, or skip to step 5.\n4. `npm run dev`. The app is on `http://localhost:5003`; `/api/*` is proxied to `http://localhost:5002` with the prefix stripped, so the browser sees one origin and CORS never applies.\n5. Against the staging backend instead: `VITE_PROXY_TARGET=https://<staging backend alias> npm run dev`. The shell variable, not `.env`, sets the proxy target.\n6. `npm test` for the helpers, `npm run lint` before a push.\n\n# Signing in locally\n\nA member session needs the Clerk dev instance, which the example key names; Discord sign-in works on `localhost:5003` without any dashboard change. The super admin session is `/admin-login` with the backend's admin token from its `.env`.\n\n# Environment values\n\n| Name | Local | Purpose |\n|---|---|---|\n| `VITE_BACKEND_URL` | `/api` | the base URL of every backend call; read once, throws when unset |\n| `VITE_CLERK_PUBLISHABLE_KEY` | the dev key | Clerk instance |\n| `VITE_CLERK_PROXY_URL` | unset | set only on the Vercel production project |\n| `VITE_PROXY_TARGET` | unset | the dev server's proxy target, from the shell |\n\nVite inlines every `VITE_` value into the public bundle; none is a secret. The environment beats the file."}, "types": ["Convention", "Decision", "Domain Concept", "Integration", "Pitfall", "Repository", "Runbook", "Unknown"], "palette": {"Domain Concept": "#2a78d6", "Decision": "#eb6834", "Runbook": "#1baf7a", "Convention": "#eda100", "Integration": "#e87ba4", "Data Model": "#008300", "API Area": "#4a3aa7", "Pitfall": "#e34948"}};
</script>
<script>

(function () {
  const bundle = window.BUNDLE;
  const bundleName = window.BUNDLE_NAME;
  document.title = `${bundleName} — OKF Viewer`;
  document.getElementById("bundle-name").textContent = bundleName;

  // Populate type filter
  const typeSelect = document.getElementById("filter-type");
  for (const t of bundle.types) {
    const opt = document.createElement("option");
    opt.value = t;
    opt.textContent = t;
    typeSelect.appendChild(opt);
  }

  // Build reverse-link index for backlinks
  const backlinks = {};
  for (const edge of bundle.edges) {
    const { source, target } = edge.data;
    (backlinks[target] ||= []).push(source);
  }

  // Look up node label/type by id
  const nodeIndex = {};
  for (const n of bundle.nodes) nodeIndex[n.data.id] = n.data;

  const cy = cytoscape({
    container: document.getElementById("graph"),
    elements: [...bundle.nodes, ...bundle.edges],
    style: [
      {
        selector: "node",
        style: {
          "background-color": "data(color)",
          "label": "data(label)",
          "color": "#0f172a",
          "font-size": 11,
          "text-valign": "bottom",
          "text-margin-y": 4,
          "text-wrap": "wrap",
          "text-max-width": 120,
          "width": "data(size)",
          "height": "data(size)",
          "border-width": 1,
          "border-color": "#0f172a",
        },
      },
      {
        selector: "node[?stale]",
        style: {
          "border-width": 2,
          "border-color": "#b91c1c",
          "border-style": "dashed",
        },
      },
      {
        selector: 'node[status = "deprecated"]',
        style: {
          "opacity": 0.55,
        },
      },
      {
        selector: "node:selected",
        style: {
          "border-width": 3,
          "border-color": "#f59e0b",
        },
      },
      {
        selector: "edge",
        style: {
          "width": 1.5,
          "line-color": "#cbd5e1",
          "target-arrow-color": "#cbd5e1",
          "target-arrow-shape": "triangle",
          "curve-style": "bezier",
          "arrow-scale": 0.9,
        },
      },
      {
        selector: "edge:selected",
        style: {
          "line-color": "#f59e0b",
          "target-arrow-color": "#f59e0b",
          "width": 2.5,
        },
      },
      {
        selector: ".dim",
        style: { "opacity": 0.15 },
      },
    ],
    layout: { name: "cose", animate: false, padding: 30 },
    wheelSensitivity: 0.2,
  });

  cy.on("tap", "node", (evt) => showDetail(evt.target.id()));
  cy.on("tap", (evt) => {
    if (evt.target === cy) clearSelection();
  });

  document.getElementById("layout").addEventListener("change", (e) => {
    cy.layout({ name: e.target.value, animate: false, padding: 30 }).run();
  });

  document.getElementById("reset").addEventListener("click", () => {
    cy.fit(null, 30);
    clearSelection();
  });

  document.getElementById("search").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (!q) {
      cy.elements().removeClass("dim");
      return;
    }
    cy.nodes().forEach((n) => {
      const d = n.data();
      const hay =
        (d.label || "").toLowerCase() + " " +
        d.id.toLowerCase() + " " +
        (d.tags || []).join(" ").toLowerCase();
      n.toggleClass("dim", !hay.includes(q));
    });
    cy.edges().forEach((edge) => {
      const src = edge.source();
      const tgt = edge.target();
      edge.toggleClass("dim", src.hasClass("dim") || tgt.hasClass("dim"));
    });
  });

  document.getElementById("filter-type").addEventListener("change", (e) => {
    const t = e.target.value;
    if (!t) {
      cy.elements().removeClass("dim");
      return;
    }
    cy.nodes().forEach((n) => {
      n.toggleClass("dim", n.data("type") !== t);
    });
    cy.edges().forEach((edge) => {
      edge.toggleClass("dim", edge.source().hasClass("dim") || edge.target().hasClass("dim"));
    });
  });

  function clearSelection() {
    cy.elements().unselect();
    document.getElementById("detail-empty").hidden = false;
    document.getElementById("detail-content").hidden = true;
  }

  function showDetail(conceptId) {
    const data = nodeIndex[conceptId];
    if (!data) return;
    cy.elements().unselect();
    const node = cy.getElementById(conceptId);
    if (node) node.select();

    document.getElementById("detail-empty").hidden = true;
    const content = document.getElementById("detail-content");
    content.hidden = false;

    const chip = document.getElementById("detail-type");
    chip.textContent = data.type;
    chip.style.background = data.color;

    document.getElementById("detail-title").textContent = data.label;
    document.getElementById("detail-id").textContent = conceptId;
    document.getElementById("detail-description").textContent = data.description || "—";

    const resourceEl = document.getElementById("detail-resource");
    resourceEl.innerHTML = "";
    if (data.resource) {
      const a = document.createElement("a");
      a.href = data.resource;
      a.textContent = data.resource;
      a.target = "_blank";
      a.rel = "noopener";
      a.className = "external";
      resourceEl.appendChild(a);
    } else {
      resourceEl.textContent = "—";
    }

    const tagsEl = document.getElementById("detail-tags");
    tagsEl.innerHTML = "";
    if (data.tags && data.tags.length) {
      for (const t of data.tags) {
        const span = document.createElement("span");
        span.className = "tag";
        span.textContent = t;
        tagsEl.appendChild(span);
      }
    } else {
      tagsEl.textContent = "—";
    }

    // v0.2 signal badges: status, trust tier, staleness.
    const badgesEl = document.getElementById("detail-badges");
    badgesEl.innerHTML = "";
    const status = data.status || "stable";
    badgesEl.appendChild(makeBadge(status, "status-" + status));
    const tier = data.trust_tier || "unverified";
    badgesEl.appendChild(makeBadge(tier.replace(/-/g, " "), "trust-" + tier));
    if (data.stale) {
      const label = data.stale_after ? `stale (since ${data.stale_after})` : "stale";
      badgesEl.appendChild(makeBadge(label, "stale"));
    } else if (data.stale_after) {
      badgesEl.appendChild(makeBadge(`stale after ${data.stale_after}`, "fresh"));
    }

    document.getElementById("detail-generated").textContent = formatActorEvent(data.generated);

    const verifiedEl = document.getElementById("detail-verified");
    const verified = data.verified || [];
    if (verified.length) {
      verifiedEl.textContent = verified.map(formatActorEvent).join("; ");
    } else {
      verifiedEl.textContent = "—";
    }

    const sourcesEl = document.getElementById("detail-sources");
    sourcesEl.innerHTML = "";
    const sources = data.sources || [];
    if (sources.length) {
      const ul = document.createElement("ul");
      ul.className = "sources-list";
      for (const s of sources) {
        const li = document.createElement("li");
        const label = s.title || s.resource || s.id || "source";
        if (s.resource && /^https?:\/\//.test(s.resource)) {
          const a = document.createElement("a");
          a.href = s.resource;
          a.textContent = label;
          a.target = "_blank";
          a.rel = "noopener";
          a.className = "external";
          li.appendChild(a);
        } else {
          li.textContent = s.resource ? `${label} (${s.resource})` : label;
        }
        ul.appendChild(li);
      }
      sourcesEl.appendChild(ul);
    } else {
      sourcesEl.textContent = "—";
    }

    const body = bundle.bodies[conceptId] || "";
    const html = marked.parse(body, { breaks: false, gfm: true });
    const bodyEl = document.getElementById("detail-body");
    bodyEl.innerHTML = html;
    rewriteInternalLinks(bodyEl);

    const bl = backlinks[conceptId] || [];
    const blSection = document.getElementById("detail-backlinks");
    const blList = document.getElementById("backlinks-list");
    blList.innerHTML = "";
    if (bl.length) {
      blSection.hidden = false;
      for (const src of bl) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.textContent = nodeIndex[src]?.label || src;
        a.dataset.target = src;
        a.addEventListener("click", () => showDetail(src));
        li.appendChild(a);
        const muted = document.createElement("span");
        muted.className = "muted";
        muted.textContent = ` (${src})`;
        li.appendChild(muted);
        blList.appendChild(li);
      }
    } else {
      blSection.hidden = true;
    }

    cy.animate({ center: { eles: node }, zoom: Math.max(cy.zoom(), 1.0) }, { duration: 200 });
  }

  function makeBadge(text, cls) {
    const span = document.createElement("span");
    span.className = "badge " + cls;
    span.textContent = text;
    return span;
  }

  function formatActorEvent(event) {
    if (!event || !event.by) return "—";
    return event.at ? `${event.by} · ${event.at}` : String(event.by);
  }

  function rewriteInternalLinks(root) {
    root.querySelectorAll("a[href]").forEach((a) => {
      const href = a.getAttribute("href");
      if (!href) return;
      if (href.startsWith("/") && href.endsWith(".md")) {
        const target = href.slice(1, -3);
        if (nodeIndex[target]) {
          a.className = "internal";
          a.setAttribute("href", "javascript:void(0)");
          a.addEventListener("click", (e) => {
            e.preventDefault();
            showDetail(target);
          });
          return;
        }
      }
      a.className = "external";
      a.setAttribute("target", "_blank");
      a.setAttribute("rel", "noopener");
    });
  }

  // Auto-show the first node (a dataset if available, else first concept)
  const initial =
    bundle.nodes.find((n) => n.data.type === "BigQuery Dataset") ||
    bundle.nodes[0];
  if (initial) showDetail(initial.data.id);
})();

</script>
