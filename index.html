<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GNL</title>

    <!-- bootstrap css -->
    <link href="//netdna.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body>
    <script>
        // Paint the stored theme's ground before the app loads, so a hard load does not
        // flash white. Same three modes as src/helpers/theme.js.
        try {
            var q = new URLSearchParams(location.search).get('readonly');
            var mode = (q === '1' || q === 'true') ? 'light' : (localStorage.getItem('theme') || 'system');
            var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
            document.body.style.backgroundColor = dark ? '#151B17' : '#E8E9E3';
        } catch (e) { /* a browser that blocks storage just keeps the default ground */ }
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
</body>

</html>
